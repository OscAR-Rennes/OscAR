name: Checkstyle CI

on:
  push:
    paths:
      - 'frontend-desktop/**'
      - 'frontendMobile/**'
      - 'backend/**'
      - '.github/workflows/CheckStyle.yml'
  pull_request:
    paths:
      - 'frontend-desktop/**'
      - 'frontendMobile/**'
      - 'backend/**'
      - '.github/workflows/CheckStyle.yml'

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend-desktop/package-lock.json
            frontendMobile/package-lock.json
            backend/package-lock.json

      - name: Install dependencies (frontend-desktop)
        run: |
          cd frontend-desktop
          if [ -f package-lock.json ] ; then
            npm ci
          else
            npm install
          fi

      - name: ESLint frontend-desktop
        run: |
          cd frontend-desktop
          LINT_SCRIPT=$(node -p "require('./package.json').scripts?.lint || ''")
          if [ -z "$LINT_SCRIPT" ] || [[ "$LINT_SCRIPT" == *"No lint configured"* ]]; then
            echo "No frontend-desktop lint configured, skipping"
          else
            npm run lint
          fi

      - name: Install dependencies (frontendMobile)
        run: |
          cd frontendMobile
          if [ -f package-lock.json ] ; then
            npm ci
          else
            npm install
          fi

      - name: ESLint frontendMobile
        run: |
          cd frontendMobile
          npm run lint || exit 1

      - name: Install dependencies (backend)
        run: |
          cd backend
          if [ -f package-lock.json ] ; then
            npm ci
          else
            npm install
          fi

      - name: ESLint backend
        run: |
          cd backend
          npm run lint || exit 1
