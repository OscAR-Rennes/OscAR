name: Prod Deployment to Vercel (frontend-desktop)

on:
  push:
    branches:
      - master
    paths:
      - 'frontend-desktop/**'
  workflow_dispatch: {}

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd frontend-desktop
          npm install

      - name: Install latest Vercel CLI
        run: |
          cd frontend-desktop
          npm install -D vercel@latest

      - name: Build project
        run: |
          cd frontend-desktop
          npm run build

      - name: Create prebuilt output and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd frontend-desktop
          DEPLOYMENT_URL=$(npx vercel deploy --prod --yes --token=$VERCEL_TOKEN --json | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8').trim(); const output=JSON.parse(input); process.stdout.write(output.url || '')")
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Failed to resolve deployment URL"
            exit 1
          fi
          echo "Deployment URL: $DEPLOYMENT_URL"
          npx vercel alias --token=$VERCEL_TOKEN "$DEPLOYMENT_URL" oscar-deploiement.vercel.app


