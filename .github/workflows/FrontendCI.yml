name: Frontends CI

on:
  push:
    paths:
      - 'frontend-desktop/**'
      - 'frontendMobile/**'
      - '.github/workflows/FrontendCI.yml'
  pull_request:
    paths:
      - 'frontend-desktop/**'
      - 'frontendMobile/**'
      - '.github/workflows/FrontendCI.yml'

jobs:
  desktop:
    name: Desktop (React + Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend-desktop/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend-desktop
          if [ -f package-lock.json ] ; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: |
          cd frontend-desktop
          npm test -- --watch=false

      - name: Build Docker image
        run: |
          cd frontend-desktop
          docker build -t react-desktop .

  mobile:
    name: Mobile (React Native + Metro)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontendMobile/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontendMobile
          if [ -f package-lock.json ] ; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: |
          cd frontendMobile
          npm run lint

      - name: Run Jest tests
        run: |
          cd frontendMobile
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")
          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == *"No tests configured"* ]]; then
            echo "No frontendMobile test script configured, skipping tests"
          else
            npm test -- --watch=false
          fi
