name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/BackendCI.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/BackendCI.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd backend
          if [ -f package-lock.json ] ; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: |
          cd backend
          npm run lint

      - name: Run tests
        run: |
          cd backend
          TEST_SCRIPT=$(node -p "require('./package.json').scripts?.test || ''")
          if [ -z "$TEST_SCRIPT" ] || [[ "$TEST_SCRIPT" == *"No tests configured"* ]]; then
            echo "No backend test script configured, skipping tests"
          else
            npm test -- --watch=false
          fi

      - name: Build TypeScript (if tsconfig.json exists)
        run: |
          if [ -f backend/tsconfig.json ]; then
            cd backend
            npm run build
          else
            echo "No tsconfig.json found, skipping build"
          fi

      - name: Build Docker image (if Dockerfile exists)
        run: |
          if [ -f backend/Dockerfile ]; then
            cd backend
            docker build -t backend-app .
          else
            echo "No Dockerfile found, skipping Docker build"
          fi
